version: 1
project:
  title: Principles of Mechanics
  subtitle: Fundamental University Physics
  short_title: Principles of Mechanics
  description: >-
    An accessible MyST edition of Salma Alrasheed's open textbook covering
    foundational university mechanics from vectors and kinematics through
    central-force motion and oscillations.
  keywords:
    - classical mechanics
    - university physics
    - kinematics
    - dynamics
    - open textbook
  authors:
    - name: Salma Alrasheed
      affiliations:
        - institution: King Abdullah University of Science and Technology
          city: Thuwal
          country: Saudi Arabia
  date: 2019-01-01
  doi: 10.1007/978-3-030-15195-9
  license: CC-BY-4.0
  open_access: true
  bibliography: references.bib
  github: QuadriviumPress/principlesOfMechanics
  # Remote hosts often answer 403, 404, or 5xx to the CI checker even when the
  # page is fine in a browser. Internal links and missing files still fail.
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        - "{http,https}://**"
    - rule: doi-link-valid
      severity: ignore
  toc:
    - file: index.md
    - file: chapters/ch-01-units-and-vectors.md
    - file: chapters/ch-02-kinematics.md
    - file: chapters/ch-03-newtons-laws.md
    - file: chapters/ch-04-work-and-energy.md
    - file: chapters/ch-05-impulse-momentum-and-collisions.md
    - file: chapters/ch-06-system-of-particles.md
    - file: chapters/ch-07-rotation-of-rigid-bodies.md
    - file: chapters/ch-08-rolling-and-static-equilibrium.md
    - file: chapters/ch-09-central-force-motion.md
    - file: chapters/ch-10-oscillatory-motion.md
    - file: references.md
site:
  template: book-theme
  title: Principles of Mechanics
  options:
    favicon: images/favicon.svg
    logo: images/logo.svg
    logo_dark: images/logo-dark.svg
    logo_alt: Lever balanced on a triangular fulcrum
    logo_text: Principles of Mechanics
    logo_url: /
  actions:
    - title: Springer Open Access Book
      url: https://link.springer.com/book/10.1007/978-3-030-15195-9
  nav:
    - title: Sources & Attribution
      url: https://github.com/QuadriviumPress/principlesOfMechanics/blob/main/SOURCES.md
